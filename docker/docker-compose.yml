# Local PostgreSQL for development. The API itself runs on the host via pnpm.
#
#   docker compose -f docker/docker-compose.yml up -d
#
# Defaults match .env.example. If you change the DATABASE_* values in .env,
# add `--env-file .env` so the container uses the same credentials and port.
name: while-building-api

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-while_building}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
